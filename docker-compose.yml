# 命名卷声明放在 services 之前，避免部分解析/合并场景下末尾 volumes 未被识别（如 kafka_data 未定义）。
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  kafka_data:
    driver: local


# 单请求 Demo 的最低资源档；优先保证能够启动，不适用于并发和生产环境。
x-deploy-frontend: &deploy-frontend
  resources:
    limits:
      cpus: "0.25"
      memory: 192M
    reservations:
      cpus: "0.05"
      memory: 32M

x-deploy-java: &deploy-java
  resources:
    limits:
      cpus: "0.50"
      memory: 512M
    reservations:
      cpus: "0.10"
      memory: 128M

x-deploy-mysql: &deploy-mysql
  resources:
    limits:
      cpus: "0.50"
      memory: 512M
    reservations:
      cpus: "0.10"
      memory: 128M

x-deploy-redis: &deploy-redis
  resources:
    limits:
      cpus: "0.20"
      memory: 160M
    reservations:
      cpus: "0.05"
      memory: 32M

x-deploy-nacos: &deploy-nacos
  resources:
    limits:
      cpus: "0.50"
      memory: 640M
    reservations:
      cpus: "0.10"
      memory: 256M

x-deploy-kafka: &deploy-kafka
  resources:
    limits:
      cpus: "0.50"
      memory: 768M
    reservations:
      cpus: "0.10"
      memory: 256M

x-deploy-nginx: &deploy-nginx
  resources:
    limits:
      cpus: "0.10"
      memory: 96M
    reservations:
      cpus: "0.02"
      memory: 16M

# 单请求 Demo：压低堆与 Code Cache，同时保留 Spring Boot 冷启动所需的 Metaspace。
x-java-tool-options: &java-tool-options JAVA_TOOL_OPTIONS=-Xms32m -Xmx256m -XX:+UseG1GC -Xss256k -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=32m -XX:+ExitOnOutOfMemoryError

services:

  # 应用服务 业务支撑应用
  g2rain-manager-app:
    image: ${MANAGER_APP_IMAGE:-ghcr.io/g2rain/g2rain-manager-app:1.0.0}
    container_name: g2rain-manager-app
    restart: unless-stopped
    volumes:
      - ./logs/g2rain-manager-app:/logs
      - ./config/g2rain-manager-app/keys:/usr/local/openresty/nginx/lua/keys:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SERVER_PORT=8080
      - CONTEXT_PATH=/manager
      - SSO_BASE_URL=${PLATFORM_BASE_URL}
      - GATEWAY_HOST=g2rain-gateway
      - GATEWAY_PORT=8080
      - IAM_HOST=g2rain-iam
      - IAM_PORT=8080
    networks:
      - g2rain-network
    depends_on:
      g2rain-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ 2>/dev/null || nc -z 127.0.0.1 8080 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    deploy: *deploy-frontend

  # 应用服务 基础设施控制台子应用
  g2rain-infra-app:
    image: ${INFRA_APP_IMAGE:-ghcr.io/g2rain/g2rain-infra-app:1.0.0}
    container_name: g2rain-infra-app
    restart: unless-stopped
    volumes:
      - ./logs/g2rain-infra-app:/logs
      - ./config/g2rain-infra-app/keys:/usr/local/openresty/nginx/lua/keys:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SERVER_PORT=8080
      - CONTEXT_PATH=/infra
      - SSO_BASE_URL=${PLATFORM_BASE_URL}
      - GATEWAY_HOST=g2rain-gateway
      - GATEWAY_PORT=8080
      - IAM_HOST=g2rain-iam
      - IAM_PORT=8080
    networks:
      - g2rain-network
    depends_on:
      g2rain-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ 2>/dev/null || nc -z 127.0.0.1 8080 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    deploy: *deploy-frontend

  # 应用服务 控制台默认应用
  g2rain-main-shell:
    image: ${MAIN_SHELL_IMAGE:-ghcr.io/g2rain/g2rain-main-shell:1.0.0}
    container_name: g2rain-main-shell
    restart: unless-stopped
    volumes:
      - ./logs/g2rain-main-shell:/logs
      - ./config/g2rain-main-shell/keys:/usr/local/openresty/nginx/lua/keys:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SERVER_PORT=8080
      - CONTEXT_PATH=/main
      - SSO_BASE_URL=${PLATFORM_BASE_URL}
      - GATEWAY_HOST=g2rain-gateway
      - GATEWAY_PORT=8080
      - IAM_HOST=g2rain-iam
      - IAM_PORT=8080
    networks:
      - g2rain-network
    depends_on:
      g2rain-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ 2>/dev/null || nc -z 127.0.0.1 8080 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    deploy: *deploy-frontend

  # 管理主壳是平台基础入口，始终随基础栈启动
  g2rain-admin-shell:
    image: ${ADMIN_SHELL_IMAGE:-ghcr.io/g2rain/g2rain-admin-shell:1.0.0}
    container_name: g2rain-admin-shell
    restart: unless-stopped
    volumes:
      - ./logs/g2rain-admin-shell:/logs
      - ./config/g2rain-admin-shell/keys:/usr/local/openresty/nginx/lua/keys:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SERVER_PORT=8080
      - CONTEXT_PATH=/admin
      - APPLICATION_CODE=g2rain-admin-shell
      - SSO_BASE_URL=${PLATFORM_BASE_URL}
      - GATEWAY_HOST=g2rain-gateway
      - GATEWAY_PORT=8080
      - IAM_HOST=g2rain-iam
      - IAM_PORT=8080
    networks:
      - g2rain-network
    depends_on:
      g2rain-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ 2>/dev/null || nc -z 127.0.0.1 8080 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    deploy: *deploy-frontend

  # 后端服务 网关
  # 启动时 GatewayRouteLoader 会同步动态路由并调用 g2rain-basis；须等 basis 健康后再起。
  g2rain-gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/g2rain/g2rain-gateway-webflux:1.0.0}
    container_name: g2rain-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-10001}:8080"
    volumes:
      - ./logs/g2rain-gateway:/logs
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-test}
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:-nacos:8848}
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE=${NACOS_NAMESPACE:-g2rain-test}
      - SPRING_CLOUD_NACOS_CONFIG_USERNAME=${NACOS_AUTH_IDENTITY_KEY:-g2rain-admin}
      - SPRING_CLOUD_NACOS_CONFIG_PASSWORD=${NACOS_AUTH_IDENTITY_VALUE:-G2Rain@Nacos2024!Secure}
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE=${NACOS_NAMESPACE:-g2rain-test}
      - SPRING_CLOUD_NACOS_DISCOVERY_USERNAME=${NACOS_AUTH_IDENTITY_KEY:-g2rain-admin}
      - SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD=${NACOS_AUTH_IDENTITY_VALUE:-G2Rain@Nacos2024!Secure}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - SPRING_KAFKA_ENABLED=${SPRING_KAFKA_ENABLED:-true}
      - *java-tool-options
    networks:
      - g2rain-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      kafka:
        condition: service_healthy
      g2rain-basis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 180s
    deploy: *deploy-java

  # 后端服务 basis认证
  g2rain-basis:
    image: ${BASIS_IMAGE:-ghcr.io/g2rain/g2rain-basis:1.0.0}
    container_name: g2rain-basis
    restart: unless-stopped
    volumes:
      - ./logs/g2rain-basis:/logs
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-test}
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:-nacos:8848}
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE=${NACOS_NAMESPACE:-g2rain-test}
      - SPRING_CLOUD_NACOS_CONFIG_USERNAME=${NACOS_AUTH_IDENTITY_KEY:-g2rain-admin}
      - SPRING_CLOUD_NACOS_CONFIG_PASSWORD=${NACOS_AUTH_IDENTITY_VALUE:-G2Rain@Nacos2024!Secure}
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE=${NACOS_NAMESPACE:-g2rain-test}
      - SPRING_CLOUD_NACOS_DISCOVERY_USERNAME=${NACOS_AUTH_IDENTITY_KEY:-g2rain-admin}
      - SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD=${NACOS_AUTH_IDENTITY_VALUE:-G2Rain@Nacos2024!Secure}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - G2RAIN_AUDIT_EVENT_ENABLED=${G2RAIN_AUDIT_EVENT_ENABLED:-true}
      - *java-tool-options
    networks:
      - g2rain-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 180s
    deploy: *deploy-java

  # 后端服务 infra认证
  g2rain-infra:
    image: ${INFRA_IMAGE:-ghcr.io/g2rain/g2rain-infra:1.0.0}
    container_name: g2rain-infra
    restart: unless-stopped
    volumes:
      - ./logs/g2rain-infra:/logs
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-test}
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:-nacos:8848}
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE=${NACOS_NAMESPACE:-g2rain-test}
      - SPRING_CLOUD_NACOS_CONFIG_USERNAME=${NACOS_AUTH_IDENTITY_KEY:-g2rain-admin}
      - SPRING_CLOUD_NACOS_CONFIG_PASSWORD=${NACOS_AUTH_IDENTITY_VALUE:-G2Rain@Nacos2024!Secure}
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE=${NACOS_NAMESPACE:-g2rain-test}
      - SPRING_CLOUD_NACOS_DISCOVERY_USERNAME=${NACOS_AUTH_IDENTITY_KEY:-g2rain-admin}
      - SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD=${NACOS_AUTH_IDENTITY_VALUE:-G2Rain@Nacos2024!Secure}
      - *java-tool-options
    networks:
      - g2rain-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 180s
    deploy: *deploy-java

  # 后端服务 IAM认证
  g2rain-iam:
    image: ${IAM_IMAGE:-ghcr.io/g2rain/g2rain-iam:1.0.0}
    container_name: g2rain-iam
    restart: unless-stopped
    ports:
      - "${IAM_PORT:-10000}:8080"
    volumes:
      - ./logs/g2rain-iam:/logs
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-test}
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:-nacos:8848}
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE=${NACOS_NAMESPACE:-g2rain-test}
      - SPRING_CLOUD_NACOS_CONFIG_USERNAME=${NACOS_AUTH_IDENTITY_KEY:-g2rain-admin}
      - SPRING_CLOUD_NACOS_CONFIG_PASSWORD=${NACOS_AUTH_IDENTITY_VALUE:-G2Rain@Nacos2024!Secure}
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE=${NACOS_NAMESPACE:-g2rain-test}
      - SPRING_CLOUD_NACOS_DISCOVERY_USERNAME=${NACOS_AUTH_IDENTITY_KEY:-g2rain-admin}
      - SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD=${NACOS_AUTH_IDENTITY_VALUE:-G2Rain@Nacos2024!Secure}
      - IAM_BASE_URL=${IAM_BASE_URL:-${PLATFORM_BASE_URL:-}}
      - PLATFORM_BASE_URL=${PLATFORM_BASE_URL:-}
      - *java-tool-options
    networks:
      - g2rain-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 180s
    deploy: *deploy-java

  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-g2rain123456}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-g2rain}
      - MYSQL_USER=${MYSQL_USER:-g2rain}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-g2rain123456}
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./config/mysql/init-nacos.sql:/docker-entrypoint-initdb.d/init-nacos.sql
      # 业务库初始化 SQL 放在 config/mysql/ 下（仅空数据卷首次启动时执行）
      - ./config/mysql/g2rain-infra.sql:/docker-entrypoint-initdb.d/g2rain-infra.sql
      - ./config/mysql/g2rain-basis.sql:/docker-entrypoint-initdb.d/g2rain-basis.sql
      - ./config/mysql/g2rain-cms.sql:/docker-entrypoint-initdb.d/g2rain-cms.sql
      - ./config/mysql/g2rain-department.sql:/docker-entrypoint-initdb.d/g2rain-department.sql
      - ./config/mysql/g2rain-member.sql:/docker-entrypoint-initdb.d/g2rain-member.sql
      - ./config/mysql/g2rain-agent-studio.sql:/docker-entrypoint-initdb.d/g2rain-agent-studio.sql
      - ./config/mysql/g2rain-agent-runtime.sql:/docker-entrypoint-initdb.d/g2rain-agent-runtime.sql
      - ./config/mysql/g2rain-model-nexus.sql:/docker-entrypoint-initdb.d/g2rain-model-nexus.sql
      - ./config/mysql/g2rain-mcp-registry.sql:/docker-entrypoint-initdb.d/g2rain-mcp-registry.sql
      - ./logs/mysql:/var/log/mysql
    networks:
      - g2rain-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD:-g2rain123456} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 180s
    deploy: *deploy-mysql

  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - g2rain-network
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy: *deploy-redis

  # Nacos注册中心
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: nacos
    restart: unless-stopped
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - ./data/nacos:/home/nacos/data
      - ./logs/nacos:/home/nacos/logs
      - ./config/nacos/logback-spring.xml:/home/nacos/conf/logback-spring.xml
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=${MYSQL_SERVICE_HOST:-mysql}
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=${NACOS_DATABASE:-nacos}
      - MYSQL_SERVICE_USER=${NACOS_MYSQL_USER:-nacos}
      - MYSQL_SERVICE_PASSWORD=${NACOS_MYSQL_PASSWORD:-g2rain_nacos}
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:-VGhyZWVGb3J0eVR3b0J5dGVzU2VjcmV0S2V5Rm9yTmFjb3M=}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:-nacos}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:-g2rain_nacos}
      # 日志优化配置
      - LOGGING_LEVEL_ROOT=WARN
      - LOGGING_LEVEL_COM_ALIBABA_NACOS=WARN
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK=WARN
      - LOGGING_LEVEL_ORG_MYBATIS=WARN
      - LOGGING_LEVEL_ORG_APACHE=WARN
      - NACOS_SERVER_LOG_LEVEL=WARN
      # 性能优化配置
      - NACOS_SERVER_TOMCAT_ACCESSLOG_ENABLED=false
      - NACOS_SERVER_TOMCAT_ACCESSLOG_PATTERN=
      - NACOS_SERVER_TOMCAT_ACCESSLOG_MAXDAYS=3
      - NACOS_SERVER_TOMCAT_ACCESSLOG_MAXSIZE=10MB
      # 测试环境压低堆；容器 limit 见 x-deploy-nacos
      - JVM_XMS=128m
      - JVM_XMX=384m
    networks:
      - g2rain-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    deploy: *deploy-nacos

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/conf.d:/etc/nginx/conf.d
      - ./logs/nginx:/var/log/nginx
      - ./ssl:/etc/nginx/ssl:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - g2rain-network
    depends_on:
      g2rain-gateway:
        condition: service_healthy
    # 覆盖镜像默认对 http://localhost:80/ 的检查：本项目仅监听 443（HTTPS），否则会被误判 unhealthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && nc -z 127.0.0.1 443"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    deploy: *deploy-nginx

  # Kafka（单节点 KRaft，无 ZooKeeper，供联调；官方镜像 apache/kafka）
  # 容器内地址：kafka:9092，例如 spring.kafka.bootstrap-servers=kafka:9092
  # 官方镜像默认 appuser(1000)；命名卷多为 root 所有，会 AccessDenied。联调以 root 跑写入。
  # 数据卷异常时可：docker volume rm g2rain-bootstrap_kafka_data
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    user: "0:0"
    restart: unless-stopped
    hostname: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - CLUSTER_ID=4L6g3nShT-eMCtK--X86sw
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_MESSAGE_MAX_BYTES=10485760
      - KAFKA_REPLICA_FETCH_MAX_BYTES=10485760
      - KAFKA_LOG_DIRS=/tmp/kraft-combined-logs
      - KAFKA_HEAP_OPTS=-Xms256m -Xmx512m
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - g2rain-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    deploy: *deploy-kafka

networks:
  g2rain-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
